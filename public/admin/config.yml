backend:
  name: github
  repo: kamakhyatrandingco-design/wholesale-catalog
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Wholesale Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "SKU", name: "sku", widget: "string" }
      - { label: "Wholesale Price (₹)", name: "price", widget: "number" }
      - {
          label: "Minimum Order Quantity (MOQ)",
          name: "moq",
          widget: "number",
          default: 10,
        }
      - {
          label: "Base Garment Image",
          name: "image",
          widget: "image",
          required: false,
        }
      - {
          label: "AI Try-On Image URL",
          name: "ai_image",
          widget: "string",
          required: false,
        }
      - label: "Color Variants"
        name: "color_variants"
        widget: "list"
        required: false
        fields:
          - { label: "Color Name", name: "color_name", widget: "string" }
          - {
              label: "Hex Code (e.g. #FF0000)",
              name: "hex_code",
              widget: "string",
            }
