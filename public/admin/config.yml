backend:
  name: github
  repo: kamakhyatrandingco-design/wholesale-catalog
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Apparel Catalog"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Title", name: "title", widget: "string" }
      - { label: "SKU", name: "sku", widget: "string" }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options:
            [
              "Ethnic Wear",
              "Western Wear",
              "Girls Partywear",
              "Bridal",
              "Loungewear",
            ],
        }
      - {
          label: "Retail Price (Single Piece ₹)",
          name: "retail_price",
          widget: "number",
        }
      - {
          label: "Wholesale Price (Bulk ₹)",
          name: "wholesale_price",
          widget: "number",
        }
      - {
          label: "Minimum Order Quantity (MOQ)",
          name: "moq",
          widget: "number",
          default: 5,
        }
      - {
          label: "Sizes Available",
          name: "sizes",
          widget: "select",
          multiple: true,
          options: ["XS", "S", "M", "L", "XL", "XXL", "Free Size"],
        }
      - {
          label: "Product Image",
          name: "image",
          widget: "image",
          required: false,
        }
      - label: "Color Variants"
        name: "color_variants"
        widget: "list"
        required: false
        fields:
          - { label: "Color Name", name: "color_name", widget: "string" }
          - {
              label: "Hex Code (e.g. #FF0000)",
              name: "hex_code",
              widget: "string",
            }
